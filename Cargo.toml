[package]
name = "stealthlingo"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A terminal-first language learning tool for stealthy study sessions."
license = "MIT"
readme = "README.md"
repository = "https://github.com/viys/stealthlingo"
keywords = ["cli", "vocabulary", "spaced-repetition", "dictionary", "learning"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
ctrlc = "3"
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3", "vorbis", "wav", "flac"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
